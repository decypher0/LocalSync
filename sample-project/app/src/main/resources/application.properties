spring.application.name=sample-app

# Points at the "mysql" compose service by name — only resolves inside the
# compose network. Overridden via SPRING_DATASOURCE_* env vars in
# docker-compose.yml; these are just the matching defaults for local runs.
spring.datasource.url=jdbc:mysql://mysql:3306/localsync_demo
spring.datasource.username=localsync
spring.datasource.password=localsync_demo_pw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# schema.sql/seed.sql in db-seed/ already create and populate the table via
# MySQL's docker-entrypoint-initdb.d — Hibernate must not also try to.
spring.jpa.hibernate.ddl-auto=none

server.port=8080
