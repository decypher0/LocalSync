[package]
name = "localsync-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

ls-snapshot = { path = "../../../crates/ls-snapshot" }
ls-net = { path = "../../../crates/ls-net" }
ls-security = { path = "../../../crates/ls-security" }
ls-containers = { path = "../../../crates/ls-containers" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
