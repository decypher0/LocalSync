[package]
name = "ls-composegen"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Pure logic - no Tauri, no filesystem, no processes, no network. Everything
# here is unit-testable on any machine.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
