[package]
name = "ls-snapshot"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
rand = "0.8"
anyhow = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
# Minimal docker-compose.yml read (service name/image/build/ports/depends_on).
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
