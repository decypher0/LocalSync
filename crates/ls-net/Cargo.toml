[package]
name = "ls-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
webrtc = "0.8"
# Pure no-op facade until a logger is installed (apps/desktop/src-tauri does
# that once, at startup) - lets connect_as_sender/connect_as_receiver emit
# log::info! calls for each connection-setup stage without this crate
# depending on Tauri or any file I/O.
log = "0.4"
# Round 37: LAN peer discovery (mDNS/Bonjour/Avahi) - actively maintained,
# pure-Rust, and already handles the real edge cases (name-conflict
# resolution, TTLs, service records) correctly across Windows/macOS/Linux,
# which a hand-rolled UDP broadcast protocol would have to reimplement
# itself. `ServiceDaemon`/`ServiceEvent` are re-exported from this crate
# (see lib.rs) so the desktop crate doesn't need this as a direct dependency
# too - same boundary as webrtc/tokio-tungstenite already being ls-net-only.
mdns-sd = "0.21"

[dev-dependencies]
# Only used by the nat_peer example (payload integrity check) and the
# TURN-still-prefers-direct test - not needed by the library itself.
sha2 = "0.10"
# Only used by the nat_peer example, to surface webrtc-rs/webrtc-sctp's
# `log` output (RUST_LOG=webrtc_sctp=trace) when diagnosing transport
# stalls - opt-in, silent unless RUST_LOG is set.
env_logger = "0.11"
