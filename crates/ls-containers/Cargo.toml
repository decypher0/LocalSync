[package]
name = "ls-containers"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ls-snapshot = { path = "../ls-snapshot" }
ls-security = { path = "../ls-security" }
tokio = { version = "1", features = ["process", "fs", "rt-multi-thread", "macros", "io-util"] }
anyhow = "1"
serde_yaml = "0.9"
# Round 36: matches ls-snapshot's own switch from gzip to zstd for
# `Snapshot.payload` - unpack_payload() extracts that exact payload to run
# it, so it has to speak whatever codec actually produced it.
zstd = "0.13"
tar = "0.4"
time = { version = "0.3", features = ["formatting"] }
# Cross-platform OS data-dir lookup (%APPDATA%, ~/Library/Application Support,
# ~/.local/share) for provisioning.rs's log file - avoids hand-rolling
# per-OS path logic and avoids needing Tauri's AppHandle threaded through
# run_snapshot just to find a log path.
dirs = "5"

[dev-dependencies]
tempfile = "3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
