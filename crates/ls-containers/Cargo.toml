[package]
name = "ls-containers"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ls-snapshot = { path = "../ls-snapshot" }
ls-security = { path = "../ls-security" }
tokio = { version = "1", features = ["process", "fs", "rt-multi-thread", "macros"] }
anyhow = "1"
serde_yaml = "0.9"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
time = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
